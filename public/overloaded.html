<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Please try again shortly | Vinameals</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
        --ink: #1a2e24;
        --muted: #5c6b63;
        --line: #d8e3dc;
        --cream: #f7f3eb;
        --green: #2f6b4f;
        --red: #c62828;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top, #fffdf8 0%, var(--cream) 55%, #efe8db 100%);
        color: var(--ink);
      }
      .card {
        width: min(440px, 100%);
        padding: 28px 26px 24px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(26, 46, 36, 0.08);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        margin-bottom: 14px;
        border-radius: 999px;
        background: #fdecea;
        color: var(--red);
        font-size: 22px;
        font-weight: 800;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.45rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.98rem;
      }
      .actions {
        display: grid;
        gap: 10px;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 12px;
        background: var(--green);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      a.button.secondary {
        background: #f4f8f6;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .hint {
        margin-top: 14px;
        font-size: 0.85rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">!</div>
      <h1>Website overloaded</h1>
      <p>
        The website is overloaded right now.<br />
        Please come back in <strong>2 minutes</strong>.
      </p>
      <div class="actions">
        <a class="button" href="/">Back to home</a>
        <a class="button secondary" href="javascript:location.reload()">Try again</a>
      </div>
      <p class="hint">Vinameals — real food for everyday meals</p>
    </main>
  </body>
</html>
